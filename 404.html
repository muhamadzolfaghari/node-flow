<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>NodeFlow — Redirecting...</title>
    <script>
      (function() {
        var path = window.location.pathname;
        var base = '/node-flow/';
        if (path.indexOf('/diagram-atlas/') === 0) {
          base = '/diagram-atlas/';
        }
        var subpath = path.slice(base.length);
        if (subpath.charAt(0) === '/') subpath = subpath.slice(1);
        var target = base + (subpath ? '#/' + subpath : '') + window.location.search + window.location.hash;
        window.location.replace(target);
      })();
    </script>
  </head>
  <body style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0c1017; color: #e9edf4; display: grid; place-items: center; min-height: 100vh; margin: 0;">
    <div style="text-align: center; padding: 24px;">
      <h1 style="font-size: 20px; font-weight: 600; margin-bottom: 8px;">NodeFlow</h1>
      <p style="color: #96a4b8; font-size: 14px;">Redirecting to application workspace...</p>
      <a href="./" style="display: inline-block; margin-top: 16px; padding: 8px 16px; background: #5e8cfa; color: white; border-radius: 6px; text-decoration: none; font-size: 13px;">Open NodeFlow</a>
    </div>
  </body>
</html>
