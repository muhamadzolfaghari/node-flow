        <h1>NodeFlow — Universal Visual Diagram &amp; Architecture Studio</h1>
        <p>
          NodeFlow is an open source, browser-based, local-first studio for diagrams, data models, cloud architecture, and mind maps.
          Work in projects with multiple source files, a high-performance code editor, a live diagram canvas, syntax diagnostics, format converters, and version checkpoints.
        </p>
        <h2>Core Capabilities</h2>
        <ul>
          <li><strong>Supported Formats:</strong> Mermaid, Graphviz DOT, PlantUML, Draw.io XML, D2, SQL DDL, BPMN 2.0, OpenAPI, AsyncAPI, C4 DSL, Terraform, XMind, and Markdown outlines.</li>
          <li><strong>Local-First Privacy:</strong> All diagram processing and project storage execute within your browser. Zero third-party telemetry.</li>
          <li><strong>Export Options:</strong> Scalable Vector Graphics (SVG), 2×/4× PNG, PDF documents, and standalone HTML bundles.</li>
        </ul>
