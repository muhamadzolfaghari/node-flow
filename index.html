        </p>

          <li><strong>Supported Formats:</strong> Mermaid, Graphviz DOT, PlantUML, Draw.io XML, D2, SQL DDL, BPMN 2.0, OpenAPI, AsyncAPI, C4 DSL, Terraform, XMind, and Markdown outlines.</li>
          <li><strong>Local-First Privacy:</strong> All diagram processing and project storage execute within your browser. Zero third-party telemetry.</li>
